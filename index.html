<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#080c18">
    <meta name="description" content="Space Attack — an HTML5 canvas space game.">
    <title>Space Attack</title>
    <link rel="stylesheet" href="./css/style.css">
    <script src="./js/game.js" defer></script>
  </head>
  <body>
    <main>
      <header>
        <p class="eyebrow">HTML5 CANVAS · FLIGHT TEST</p>
        <h1>Space Attack</h1>
        <p>Your ship is ready. The adventure starts here.</p>
      </header>
      <canvas id="game" width="960" height="540" tabindex="0" aria-label="Space Attack flight test. Move with arrow keys or A and D. Fire with Space. On touch screens, drag to move and tap to fire.">
        Your browser needs canvas support to play Space Attack.
      </canvas>
      <p class="controls"><kbd>←</kbd> <kbd>→</kbd> or <kbd>A</kbd> <kbd>D</kbd> to move · <kbd>Space</kbd> to fire<br>Touch: drag to move · tap to fire</p>
      <footer>Flight test 001 · More coming soon</footer>
    </main>
  </body>
</html>
